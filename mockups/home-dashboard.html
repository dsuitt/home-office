<title>Home Money Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one workbook, two books (Home / Studio) switched at the top; spreadsheet-style tabs pinned to the bottom like Google Sheets; every section opens with a navy header bar, as in the template she likes. */
:root{
  --bg:#edf1f6; --surface:#ffffff; --zebra:#f6f8fb; --ink:#1b2533; --muted:#5a6878; --line:#d3dce7;
  --navy:#1f3b5c; --navy-ink:#ffffff; --sub:#dbe7f3; --sub-ink:#1f3b5c;
  --c1:#1f3b5c; --c2:#3d78b0; --c3:#8fb6dc; --c4:#c9dcef; --c5:#4f9d69; --c6:#c98a1a;
  --good:#2e7d4f; --good-bg:#dcf0e3; --bad:#b23b3b; --bad-bg:#f8e1df; --warn:#9a6a10; --warn-bg:#fbefd6;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202b; --zebra:#1c2531; --ink:#e5ebf2; --muted:#98a6b6; --line:#2a3646;
  --navy:#2b5683; --navy-ink:#ffffff; --sub:#1f3044; --sub-ink:#cfe0f3;
  --c1:#a9cdf0; --c2:#5f9bd3; --c3:#3d6c9c; --c4:#2a4766; --c5:#6fcf97; --c6:#e5b25c;
  --good:#6fcf97; --good-bg:#173526; --bad:#f08a80; --bad-bg:#3a2020; --warn:#e5b25c; --warn-bg:#3a2d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202b; --zebra:#1c2531; --ink:#e5ebf2; --muted:#98a6b6; --line:#2a3646;
  --navy:#2b5683; --navy-ink:#ffffff; --sub:#1f3044; --sub-ink:#cfe0f3;
  --c1:#a9cdf0; --c2:#5f9bd3; --c3:#3d6c9c; --c4:#2a4766; --c5:#6fcf97; --c6:#e5b25c;
  --good:#6fcf97; --good-bg:#173526; --bad:#f08a80; --bad-bg:#3a2020; --warn:#e5b25c; --warn-bg:#3a2d16; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto}
p{margin:0} h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-top:28px;margin-bottom:18px}
header.top h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(28px,4.6vw,42px);letter-spacing:.01em;color:var(--navy)}
:root[data-theme="dark"] header.top h1{color:var(--c1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top h1{color:var(--c1)}}
header.top p{max-width:64ch;color:var(--muted);margin-top:6px}
.sample{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.other{display:inline-block;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 14px;font-weight:700;color:var(--ink);text-decoration:none}
.other:hover{border-color:var(--c2)}
.wish{display:grid;grid-template-columns:auto minmax(0,1.6fr) repeat(3,minmax(0,.8fr)) minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.wish:last-child{border-bottom:0}
.wish .nm{font-weight:700;font-size:15px}
.wish .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wish input[type=number]{width:90px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.wish .ord{display:grid;gap:2px}
.wish .ord button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:26px;height:20px;font-size:11px;cursor:pointer;line-height:1;padding:0}
.ready{font-weight:800}
.ready.now{color:var(--good)}
.ready.never{color:var(--warn)}
@media (max-width:760px){.wish{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)}.wish .span{grid-column:2/-1}}
form.add{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
form.add label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
form.add input{padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);min-width:0}
@media (max-width:760px){form.add{grid-template-columns:1fr 1fr}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .row{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid transparent;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--sub);color:var(--sub-ink);border-color:var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.bar-h{background:var(--navy);color:var(--navy-ink);text-transform:uppercase;letter-spacing:.07em;font-weight:800;font-size:13px;text-align:center;padding:9px 12px}
.bar-s{background:var(--sub);color:var(--sub-ink);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:11.5px;text-align:center;padding:6px 10px}
.pad{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:10px 8px;text-align:center}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:17px;font-weight:800}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--sub);color:var(--sub-ink);font-size:11.5px;font-weight:700;text-align:left;padding:6px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.tot td{font-weight:800;background:var(--sub)!important;color:var(--sub-ink)}
tr.sub td{font-weight:700;background:var(--zebra)}
.pos{background:var(--good-bg)!important;color:var(--good)}
.neg{background:var(--bad-bg)!important;color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-auto{background:var(--zebra);color:var(--muted);border:1px solid var(--line)}
.p-sug{background:var(--sub);color:var(--sub-ink)}
.p-ask{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--good-bg);color:var(--good)}
.p-bridge{background:var(--sub);color:var(--c2);border:1px dashed var(--c2)}
.prog{height:9px;background:var(--zebra);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c2)}
.note{font-size:13px;color:var(--muted)}
.callout{background:var(--sub);color:var(--sub-ink);border-radius:6px;padding:10px 12px;font-size:13px}
.panel svg{max-height:280px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg .gridl{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
select.cat{font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);max-width:210px}
tr.ask td{background:var(--warn-bg)!important}
.desc{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mon{border:1px solid var(--line);border-radius:4px;overflow:hidden;font-size:12.5px}
.mon .bar-s{text-align:left}
.mon.now{outline:2px solid var(--c2)}
.mon ul{list-style:none;margin:0;padding:6px 8px;display:grid;gap:3px;min-height:58px}
.mon li{display:flex;justify-content:space-between;gap:6px}
.check{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.check li{display:flex;gap:9px;align-items:center}
.box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--good);background:var(--good);color:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--surface);resize:vertical;box-sizing:border-box}
.q{display:grid;gap:5px}
.q label{font-weight:600;font-size:13px}
.adj{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.adj .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-weight:600;font-size:12.5px;cursor:pointer}
.btn.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.zero{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;padding:12px;border:2px solid var(--good);border-radius:6px;background:var(--good-bg);color:var(--good);font-weight:800;font-size:15px}
.ann td:first-child,.ann th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px}
.ann tr.tot td:first-child{background:var(--sub)}
.ann th.m{text-align:center;background:var(--navy);color:var(--navy-ink)}
.ann td{white-space:nowrap;font-size:12px;padding:5px 7px}
.ann td.sep,.ann th.sep{border-left:2px solid var(--line)}
.diff-legend{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
</style>

<div class="wrap">
<header class="top">
  <div>
    <span class="sample">Sample data, made up for this mockup</span>
    <h1>Home Money Dashboard</h1>
    <p>Same tabs as the budget template you liked, built for our household money. Transactions fill themselves in from your accounts, and you only answer what the tool can't figure out. Use the tabs at the bottom.</p>
  </div>
  <a class="other" href="https://claude.ai/artifact/BFae3ozfV9hErhLrbEmeNg">Studio dashboard →</a>
</header>
<main id="app"></main>
</div>
<nav class="tabs" aria-label="Sheets"><div class="row" id="tabs"></div></nav>

<script>
const $=(s,el=document)=>el.querySelector(s);
const fmt=(n,d=0)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const k=n=>n===0?'$0':(n<0?'−':'')+'$'+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(2)+'M':(Math.abs(n)/1000).toFixed(Math.abs(n)%1000===0?0:1)+'k');
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CUR=9; // October is the last closed month
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const C=['var(--c1)','var(--c2)','var(--c3)','var(--c5)','var(--c6)','var(--c4)','var(--muted)'];

/* ---------- chart helpers ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function bars(labels,series,colors,h=210){
  const W=640,H=h,L=46,R=8,T=10,B=26,max=niceMax(Math.max(...series.flat().map(v=>v||0)));
  const y=v=>T+(H-T-B)*(1-v/max),bw=(W-L-R)/labels.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="bar chart">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`;}
  labels.forEach((lb,i)=>{const n=series.length,gw=bw*.72,w=gw/n,x0=L+i*bw+bw*.14;
    series.forEach((ser,j)=>{const v=ser[i];if(v==null)return;s+=`<rect x="${x0+j*w}" y="${y(Math.max(v,0))}" width="${Math.max(w-2,1)}" height="${y(0)-y(Math.max(v,0))}" fill="${colors[j]}"/>`;});
    s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}
function line(labels,series,colors,{h=210,min=0,dash=[]}={}){
  const W=640,H=h,L=52,R=14,T=12,B=26,all=series.flat().filter(v=>v!=null);
  const lo=Math.min(min,...all),hi=niceMax(Math.max(...all)-lo)+lo;
  const x=i=>L+(W-L-R)*i/(labels.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="line chart">`;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${k(Math.round(v))}</text>`;}
  labels.forEach((lb,i)=>s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lb}</text>`);
  series.forEach((ser,j)=>{const pts=ser.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(j===0&&!dash[0])s+=`<path d="${d} L${pts.at(-1)[0]} ${y(Math.max(lo,0))} L${pts[0][0]} ${y(Math.max(lo,0))} Z" fill="${colors[j]}" opacity=".13"/>`;
    s+=`<path d="${d}" fill="none" stroke="${colors[j]}" stroke-width="2.4" ${dash[j]?'stroke-dasharray="6 5"':''}/>`;
    pts.forEach(p=>{if(!dash[j])s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors[j]}"/>`;});});
  return s+'</svg>';
}
function donut(rows,size=170,center=''){
  const tot=sum(rows.map(r=>Math.max(r[1],0))),r=size/2-14,c=2*Math.PI*r;let off=0;
  let s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" style="max-width:100%" role="img" aria-label="donut chart"><g transform="rotate(-90 ${size/2} ${size/2})">`;
  rows.forEach((row,i)=>{const len=Math.max(row[1],0)/tot*c;s+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${C[i%C.length]}" stroke-width="24" stroke-dasharray="${Math.max(len-1.5,0)} ${c}" stroke-dashoffset="${-off}"/>`;off+=len;});
  return s+`</g><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" style="font-size:16px;font-weight:800;fill:var(--ink)">${center}</text></svg>`;
}
const donutBlock=(rows,center)=>`<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center">${donut(rows,170,center)}<div class="legend" style="display:grid;gap:4px">${rows.map((r,i)=>`<span><i style="background:${C[i%C.length]}"></i>${r[0]} · ${pct(Math.max(r[1],0),sum(rows.map(x=>Math.max(x[1],0))))}</span>`).join('')}</div></div>`;
const hbar=(rows,color='var(--c2)')=>{const max=Math.max(...rows.map(r=>Math.abs(r[1])),1);return `<div class="grid" style="gap:8px">${rows.map(([n,v])=>`<div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.8fr) auto;gap:10px;align-items:center;font-size:12.5px"><span>${n}</span><div class="prog"><i style="width:${Math.abs(v)/max*100}%;background:${color}"></i></div><span class="num">${fmt(v)}</span></div>`).join('')}</div>`;};
const panel=(title,body,pad=true)=>`<section class="panel"><div class="bar-h">${title}</div>${pad?`<div class="pad">${body}</div>`:body}</section>`;

/* ---------- book model ---------- */
function line_(name,plan,amp=0,type,extra={}){const p=Array.isArray(plan)?plan:Array(12).fill(plan);const a=p.map((v,i)=>i>CUR?null:(amp?Math.round(v*(1+(rnd()*2-1)*amp)):v));return {name,plan:p,act:a,type,...extra};}

function homeBook(){
  seed=11;
  const income=[line_('Your paycheck (net)',7400,0,'inc'),line_('Studio owner’s pay',4500,0,'inc',{bridge:true})];
  const ess=[line_('Mortgage',2400),line_('Utilities',320,.2),line_('Groceries',900,.15),line_('Insurance',280),line_('Car & gas',450,.2),line_('Phone',95),line_('Health',200,.5),line_('Household',150,.3),line_('Subscriptions',90,.15)];
  const non=[line_('Eating out',350,.25),line_('Coffee',60,.3),line_('Clothes',150,.6),line_('Beauty & self-care',120,.4),line_('Fun & activities',150,.5),line_('Travel',300,.7),line_('Gifts',150,.6),line_('Misc',100,.6)];
  const eo=non[0]; eo.act[7]=392; eo.act[8]=405; eo.act[9]=418;
  const goal=[line_('Emergency fund',1000,0,'save'),line_('Italy trip, June',650,0,'save'),line_('New car fund',500,0,'save'),line_('Roth IRAs (both)',1166,0,'invest'),line_('Brokerage',1300,0,'invest'),line_('Car loan',485,0,'debt'),line_('Student loan',534,0,'debt')];
  return {key:'home',name:'Home',income,buckets:[
    {key:'ess',name:'Essentials',hint:'Bills and needs',lines:ess},
    {key:'non',name:'Non-essentials',hint:'Wants and fun',lines:non},
    {key:'goal',name:'Financial goals',hint:'Savings, investing, debt payoff',lines:goal}]};
}
function studioBook(){
  seed=23;
  const REV=[4200,6100,8400,11800,17500,19200,14600,16900,21300,22800,9500,5000];
  const PLAN=REV.map((v,i)=>Math.round(v*(0.9+((i*7)%5)*0.04)/100)*100);
  const split=(arr,f)=>arr.map(v=>Math.round(v*f));
  const mkInc=(n,f,extra)=>({name:n,plan:split(PLAN,f),act:split(REV,f).map((v,i)=>i>CUR?null:v),type:'inc',...extra});
  const income=[mkInc('Weddings',.70),mkInc('Sessions',.18),mkInc('Second shooting for others',.08),mkInc('Print & album sales',.04)];
  const totI=i=>sum(income.map(l=>l.plan[i])), totA=i=>sum(income.map(l=>l.act[i]));
  // build each line from monthly income (plan uses plan income, actual uses actual income with a little noise)
  const f=(name,fn,amp,type,extra)=>{const plan=M.map((_,i)=>Math.round(fn(totI(i),i)));const act=M.map((_,i)=>i>CUR?null:Math.round(fn(totA(i),i)*(1+(amp?(rnd()*2-1)*amp:0))));return {name,plan,act,type,...extra};};
  const ess=[f('Second shooters',I=>I*.09,.15),f('Albums & prints',I=>I*.06,.2),f('Software & subscriptions',()=>530,0),f('Insurance',()=>165,0),f('Phone & internet',()=>95,0),f('Card & gallery fees',I=>I*.03,.1),f('Travel & mileage',I=>I*.035,.35)];
  const non=[f('Marketing & ads',()=>400,.3),f('Education & workshops',()=>230,.8),f('Gear',I=>I*.04,.6),f('Meals with clients',()=>80,.5),f('Styled shoots',I=>I>15000?150:0,.4)];
  const costs=(i,which)=>sum([...ess,...non].map(l=>l[which][i]));
  const tax=f('Tax savings (30% of profit)',()=>0,0,'tax'); const owner=f('Owner’s pay to home',()=>4500,0,'pay',{bridge:true});
  const k401=f('Solo 401(k)',I=>I>15000?1500:0,0,'invest'); const gearF=f('Saving for (wishlist)',()=>300,0,'save'); M.forEach((_,i)=>{if(i>CUR)gearF.plan[i]=wishMonthly();});
  M.forEach((_,i)=>{tax.plan[i]=Math.round(Math.max(totI(i)-costs(i,'plan'),0)*.3); if(i<=CUR) tax.act[i]=Math.round(Math.max(totA(i)-costs(i,'act'),0)*.3);});

/* ===== 6a. Net Worth (home) ===== */
function NW(){
  seed=99;const out=[];let cash=26000,ret=138000,brk=14000,home=455000,car=21000,mort=-318500,cl=-18800,sl=-14700,cc=-1500;
  for(let i=0;i<=CUR;i++){
    cash+=1650+(i===5?-4200:0)+Math.round((rnd()-.5)*600); ret+=1166+Math.round(ret*((i===3?-.03:i===7?.035:.008))); brk+=1300+Math.round(brk*(i===3?-.04:.01));
    home+=i%3===2?2000:0; car-=250; mort+=520; cl+=420; sl+=470; cc=-1200-Math.round(rnd()*900);
    const assets=cash+ret+brk+home+car, liab=mort+cl+sl+cc;
    out.push({m:M[i],cash,ret,brk,home,car,mort,cl,sl,cc,assets,liab,nw:assets+liab});}
  return out;
}
/* ===== Saving For (studio) ===== */
VIEW.save=B=>{
  const items=WISH.items, cost=sum(items.map(w=>w.cost)), saved=sum(items.map(w=>Math.min(w.saved,w.cost))), monthly=wishMonthly();
  const next=items.map(w=>[w,monthsToGo(w)]).filter(([,n])=>n!==Infinity).sort((a,b)=>a[1]-b[1])[0];
  const idle=items.find(w=>monthsToGo(w)===Infinity);
  const top=items.find(w=>monthsToGo(w)>0&&monthsToGo(w)!==Infinity);
  const tip=top?`Add $50 a month to the ${top.name.toLowerCase()} and it’s ready in ${readyLabel(monthsToGo(top,50))} instead of ${readyLabel(monthsToGo(top))}.`:'';
  return `<div class="grid">
   <div class="grid g3">
    ${panel('Wishlist total',`<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><div class="l">Items cost</div><div class="v num">${fmt(cost)}</div></div><div class="kpi"><div class="l">Saved so far</div><div class="v num" style="color:var(--good)">${fmt(saved)}</div></div></div>
      <div style="margin-top:12px;display:grid;gap:6px"><div class="prog" style="height:12px"><i style="width:${cost?saved/cost*100:0}%;background:var(--c5)"></i></div><span class="note">${pct(saved,cost)} of everything on the list</span></div>`)}
    ${panel('Going in each month',`<div style="font-size:30px;font-weight:800" class="num">${fmt(monthly)}</div>
      <p class="note" style="margin-top:6px">This is the “Saving for” line in your Set-asides. Whatever isn’t used here goes to the slow-season reserve.</p>`)}
    ${panel('Next purchase',next?`<div style="font-size:20px;font-weight:800">${esc(next[0].name)}</div><div class="ready ${next[1]===0?'now':''}" style="font-size:16px;margin-top:4px">${readyLabel(next[1])}</div><p class="note" style="margin-top:6px">${next[1]===0?'Fully saved. Buy it whenever you like.':`${fmt(next[0].cost-next[0].saved)} still to save at ${fmt(next[0].monthly)}/month.`}</p>`:'<p class="note">Set a monthly amount on any item to see when it’s ready.</p>')}
   </div>
   ${tip||idle?`<div class="callout">${tip}${idle?` The ${idle.name.toLowerCase()} has nothing going to it yet.`:''}</div>`:''}
   ${panel('Saving for · in priority order',`${items.length?items.map((w,i)=>{const n=monthsToGo(w);const p=Math.min(w.saved/w.cost,1);return `<div class="wish">
       <div class="ord"><button data-up="${i}" aria-label="Move up" ${i===0?'disabled':''}>▲</button><button data-dn="${i}" aria-label="Move down" ${i===items.length-1?'disabled':''}>▼</button></div>
       <div class="span" style="min-width:0"><div class="nm">${i+1}. ${esc(w.name)}</div>${w.note?`<div class="note">${esc(w.note)}</div>`:''}<div class="prog" style="margin-top:6px"><i style="width:${p*100}%;background:var(--c5)"></i></div></div>
       <div><div class="lbl">Cost</div><div class="num">${fmt(w.cost)}</div></div>
       <div><div class="lbl">Saved</div><div class="num">${fmt(w.saved)}</div></div>
       <div><label class="lbl" for="m-${w.id}">Per month</label><input type="number" id="m-${w.id}" min="0" step="25" value="${w.monthly}" data-m="${i}"></div>
       <div><div class="lbl">Ready</div><div class="ready ${n===0?'now':n===Infinity?'never':''}">${readyLabel(n)}</div></div>
       <div style="display:flex;gap:6px;flex-wrap:wrap">${n===0?`<button class="btn on" data-buy="${i}">Bought it</button>`:''}<button class="btn" data-rm="${i}" aria-label="Remove ${esc(w.name)}">Remove</button></div>
     </div>`}).join(''):'<p class="pad note">Nothing on the list yet. Add your first item below.</p>'}`,false)}
   ${panel('Add something to save for',`<form class="add" id="addform">
      <label>Item<input id="a-name" required placeholder="e.g. 35mm f/1.4 lens"></label>
      <label>Cost<input id="a-cost" type="number" min="1" step="1" required placeholder="1200"></label>
      <label>Already saved<input id="a-saved" type="number" min="0" step="1" value="0"></label>
      <label>Per month<input id="a-monthly" type="number" min="0" step="25" value="50"></label>
      <button class="btn on" type="submit" style="padding:8px 14px">Add</button></form>`)}
   ${panel('Bought from the list',`<table><thead><tr><th>Item</th><th>When</th><th class="r">Cost</th></tr></thead><tbody>${WISH.bought.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.when}</td><td class="r num">${fmt(b.cost)}</td></tr>`).join('')}</tbody></table>
     <p class="note" style="margin-top:8px">When you buy something from the list, the purchase is sorted as Gear automatically and paid from this savings, so it doesn’t look like overspending that month.</p>`)}
  </div>`;
};
AFTER.save=()=>{
  const re=()=>{saveWish();render();};
  document.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{WISH.items[x.dataset.m].monthly=Math.max(0,+x.value||0);re();});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[WISH.items[i-1],WISH.items[i]]=[WISH.items[i],WISH.items[i-1]];re();});
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[WISH.items[i+1],WISH.items[i]]=[WISH.items[i],WISH.items[i+1]];re();});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{WISH.items.splice(+b.dataset.rm,1);re();});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const w=WISH.items.splice(+b.dataset.buy,1)[0];WISH.bought.unshift({name:w.name,cost:w.cost,when:'Nov 2026'});re();});
  const f=$('#addform'); if(f) f.onsubmit=e=>{e.preventDefault();const name=$('#a-name').value.trim(),cost=+$('#a-cost').value;if(!name||!(cost>0))return;
    WISH.items.push({id:WISH.next++,name,cost,saved:Math.max(0,+$('#a-saved').value||0),monthly:Math.max(0,+$('#a-monthly').value||0),note:''});re();};
};

   </div>
   ${panel('Monthly net worth tracker',`<div class="scroll"><table class="ann"><thead><tr><th style="background:var(--navy);color:var(--navy-ink)">Account</th>${d.map(x=>`<th class="m sep" colspan="2">${x.m}</th>`).join('')}</tr></thead><tbody>
     <tr class="tot"><td>Total assets</td>${d.map((x,i)=>`<td class="r num sep">${fmt(x.assets)}</td><td>${mom(i,'assets')}</td>`).join('')}</tr>

     ${rows.slice(5).map(([n,key])=>`<tr><td>${n}</td>${d.map(x=>`<td class="r num sep">${fmt(x[key])}</td><td></td>`).join('')}</tr>`).join('')}

   </tbody></table></div><p class="note" style="padding:10px 14px">Balances come from your accounts on the last day of each month. Home and car values are estimates you can edit.</p>`,false)}

/* ===== 6b. Taxes & Profit (studio) ===== */
function taxesView(B){
  const [E,N,G]=B.buckets;
  const inc=M.map((_,i)=>i>CUR?null:incT(B,'act',i)), cost=M.map((_,i)=>i>CUR?null:bT(E,'act',i)+bT(N,'act',i));
  const prof=inc.map((v,i)=>v==null?null:v-cost[i]);
  const resL=G.lines.find(l=>l.type==='reserve');let bal=9000;const res=M.map((_,i)=>{const v=i<=CUR?resL.act[i]:resL.plan[i];bal+=v;return bal;});
  const py=profitYTD(B), owed=Math.round(py*.3), saved=sum(G.lines.find(l=>l.type==='tax').act.slice(0,CUR+1));
  return `<div class="grid">
   <div class="grid g2">
    ${panel('Profit & loss · 2026 so far',`<div class="kpis"><div class="kpi"><div class="l">Income</div><div class="v num">${fmt(ytd(inc))}</div></div><div class="kpi"><div class="l">Costs</div><div class="v num">${fmt(ytd(cost))}</div></div><div class="kpi"><div class="l">Profit</div><div class="v num">${fmt(py)}</div></div></div>
      <div style="margin-top:12px"><div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c2)"></i>Income</span><span><i style="background:var(--c6)"></i>Costs</span></div>${bars(M.slice(0,CUR+1),[inc.slice(0,CUR+1),cost.slice(0,CUR+1)],['var(--c2)','var(--c6)'],190)}</div>`)}
    ${panel('Taxes',`<div style="display:grid;gap:8px"><b style="font-size:16px">Estimated tax on this year’s profit: <span class="num">${fmt(owed)}</span></b>
      <div class="prog" style="height:12px"><i style="width:${Math.min(saved/owed,1)*100}%;background:var(--c5)"></i></div>
      <span class="note num">${fmt(saved)} moved to Tax Savings so far (${pct(saved,owed)} of the estimate)</span></div>
      <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Due</th><th>Payment</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
       <tr><td>Apr 15</td><td>Q1 estimated tax</td><td class="r num">$4,200</td><td><span class="pill p-ok">Paid</span></td></tr>
       <tr><td>Jun 15</td><td>Q2 estimated tax</td><td class="r num">$6,900</td><td><span class="pill p-ok">Paid</span></td></tr>
       <tr><td>Sep 15</td><td>Q3 estimated tax</td><td class="r num">$8,800</td><td><span class="pill p-ok">Paid</span></td></tr>
       <tr><td>Jan 15</td><td>Q4 estimated tax</td><td class="r num">≈ $5,600</td><td><span class="pill p-sug">Coming up</span></td></tr></tbody></table></div>
      <p class="note" style="margin-top:8px">30% is a planning number. Your tax preparer confirms the real amount each year.</p>`)}
   </div>
   ${panel('Slow-season reserve balance',`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c2)"></i>Actual</span><span><i style="background:var(--muted)"></i>Planned for Nov–Dec</span></div>
     ${line(M,[res.map((v,i)=>i<=CUR?v:null),res.map((v,i)=>i>=CUR?v:null)],['var(--c2)','var(--muted)'],{h:200,dash:[0,1]})}
     <p class="note">Busy months fill the reserve and quiet months draw it down, so your $4,500 owner’s pay to home never changes.</p>`)}

}

/* ===== 7. Dashboard Summary ===== */
VIEW.dash=B=>{
  const [E,N,G]=B.buckets;
  const inc=M.slice(0,CUR+1).map((_,i)=>incT(B,'act',i)), spent=M.slice(0,CUR+1).map((_,i)=>bT(E,'act',i)+bT(N,'act',i));
  const ty=t=>sum(G.lines.filter(l=>l.type===t).map(l=>ytd(l.act)));
  const top=b=>[...b.lines].sort((x,y)=>ytd(y.act)-ytd(x.act)).slice(0,3);
  const yr=B.key==='home'
   ?[['Total income',ytd(inc)],['Total spent',ytd(spent)],['  Essentials',ytd(E.lines.flatMap(l=>l.act))],['  Non-essentials',ytd(N.lines.flatMap(l=>l.act))],['Total saved',ty('save')],['Total invested',ty('invest')],['Total debt paid',ty('debt')]]
   :[['Total income',ytd(inc)],['Total costs',ytd(spent)],['  Running costs',ytd(E.lines.flatMap(l=>l.act))],['  Growth',ytd(N.lines.flatMap(l=>l.act))],['Profit',ytd(inc)-ytd(spent)],['Owner’s pay to home',ty('pay')],['Set aside for taxes',ty('tax')],['Solo 401(k)',ty('invest')]];
  return `<div class="grid">
   <div class="grid g2">
    ${panel('Year in review (to date)',`<table><tbody>${yr.map(([n,v])=>`<tr class="${n.startsWith('  ')?'':'sub'}"><td style="${n.startsWith('  ')?'padding-left:22px;font-style:italic':''}">${n.trim()}</td><td class="r num">${fmt(v)}</td></tr>`).join('')}</tbody></table>`)}
    ${panel(B.key==='home'?'Income vs. total expenses':'Income vs. costs',`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>Income</span><span><i style="background:var(--c3)"></i>Spending</span></div>${bars(M.slice(0,CUR+1),[inc,spent],['var(--c1)','var(--c3)'])}`)}
   </div>
   <div class="grid g3">
    ${panel(B.key==='home'?'Income by type':'Income by type',donutBlock(B.income.map(l=>[l.name,ytd(l.act)]),fmt(ytd(inc))))}
    ${panel(`Top 3 · ${E.name}`,`<table><tbody>${top(E).map((l,i)=>`<tr><td>${i+1}. ${l.name}</td><td class="r num">${fmt(ytd(l.act))}</td></tr>`).join('')}</tbody></table>
      <div class="bar-s" style="margin:12px -14px 0">Top 3 · ${N.name}</div><table><tbody>${top(N).map((l,i)=>`<tr><td>${i+1}. ${l.name}</td><td class="r num">${fmt(ytd(l.act))}</td></tr>`).join('')}</tbody></table>`)}
    ${panel(`${G.name} so far`,hbar(G.lines.map(l=>[l.name,ytd(l.act)]),'var(--c5)'))}
   </div>
   ${panel(B.key==='home'?'Planned vs. actual spending by month':'Planned vs. actual costs by month',`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c3)"></i>Planned</span><span><i style="background:var(--c1)"></i>Actual</span></div>
     ${bars(M.slice(0,CUR+1),[M.slice(0,CUR+1).map((_,i)=>bT(E,'plan',i)+bT(N,'plan',i)),spent],['var(--c3)','var(--c1)'])}`)}
  </div>`;
};

render();
